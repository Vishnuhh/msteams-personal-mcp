name = "msteams-personal-mcp"
main = "src/worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
# Keep variables added in the Cloudflare dashboard (e.g. ADMIN_USERNAME) when deploying.
keep_vars = true

# Custom domain (the domain must be a zone in the same Cloudflare account).
# Uncomment and edit. It must stay above the first [section] below.
# routes = [
#   { pattern = "teams-mcp.example.com", custom_domain = true }
# ]

# Bundle CHANGELOG.md as text so /changelog is generated at deploy time.
rules = [
  { type = "Text", globs = ["**/*.md"], fallthrough = true }
]

[vars]
REPO_URL = "https://github.com/Vishnuhh/msteams-personal-mcp"

# Cloudflare's document converter (Workers AI toMarkdown), used to read PDFs shared in chats.
# Free for PDF conversion and available on the Workers Free plan.
[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "msteams-personal-mcp"
# Replace with the id printed by: npx wrangler d1 create msteams-personal-mcp
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Per-IP rate limits (Cloudflare Workers rate-limit bindings; period is 10 or 60 seconds).
# Offices share one IP, so the MCP limit is generous; sign-in limits stop abuse of the public page.
[[ratelimits]]
name = "LOGIN_START_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "LOGIN_POLL_LIMITER"
namespace_id = "1002"
simple = { limit = 40, period = 60 }

[[ratelimits]]
name = "MCP_LIMITER"
namespace_id = "1003"
simple = { limit = 300, period = 60 }

[[ratelimits]]
name = "OAUTH_LIMITER"
namespace_id = "1004"
simple = { limit = 30, period = 60 }

# Per-person limits (keyed by connection, not IP).
[[ratelimits]]
name = "USER_LIMITER"
namespace_id = "1005"
simple = { limit = 120, period = 60 }

# Tools that fan out across many chats (search, mentions, unread, my recent).
[[ratelimits]]
name = "HEAVY_LIMITER"
namespace_id = "1006"
simple = { limit = 10, period = 60 }

# Changes to Teams (send, reply, react, edit, delete, group changes); plus a daily cap in code.
[[ratelimits]]
name = "WRITE_LIMITER"
namespace_id = "1007"
simple = { limit = 10, period = 60 }

# Admin sign-in attempts and admin API calls.
[[ratelimits]]
name = "ADMIN_LIMITER"
namespace_id = "1008"
simple = { limit = 20, period = 60 }

# Nightly cleanup of unused connections, apps and expired codes.
[triggers]
crons = ["17 3 * * *"]

[observability]
enabled = false
